[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fallmon"
version = "0.1.0"
description = "Fall monitoring with post-event temporal verification (SisFall dataset replay, simulated IoT stream)"
requires-python = ">=3.10"

[project.scripts]
fallmon = "fallmon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
